name: Windows build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p op-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/open-painter | Out-Null
          Copy-Item target/release/op-app.exe dist/open-painter/open-painter.exe
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY.md dist/open-painter/
          Compress-Archive -Path dist/open-painter -DestinationPath open-painter-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: open-painter-windows-x64
          path: open-painter-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: open-painter-windows-x64.zip
