[package]
name = "op-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.37.0"
egui-phosphor = { version = "0.14.0", path = "../egui-phosphor" }
egui_dock = { version = "0.21.1", path = "../egui_dock", features = ["serde"] }
glam = "0.34.1"
op-bake = { version = "0.0.1", path = "../op-bake" }
op-core = { version = "0.0.1", path = "../op-core" }
op-export = { version = "0.0.1", path = "../op-export" }
op-mesh = { version = "0.0.1", path = "../op-mesh" }
op-proc = { version = "0.0.1", path = "../op-proc" }
op-project = { version = "0.0.1", path = "../op-project" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
tempfile = "3.27.0"
